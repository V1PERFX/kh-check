body{background:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),

  radial-gradient(circle at 60% 10%,rgba(120,120,255,.25),transparent 35%),
  linear-gradient(180deg,var(--bg1),var(--bg0) 75%);
  background-size:600px 600px,700px 700px,500px 500px,800px 800px,650px 650px,900px 900px,100% 100%,100% 100%,100% 100%,100% 100%;background-attachment:fixed}
.cmd li button{clip-path:none;border-radius:30px;padding-left:14px}
.cmd li button.on::before{content:"✦"}
.phead h2,.char b,.sech b{font-weight:700;letter-spacing:.02em}
.box{border-radius:50%;transform:none}
